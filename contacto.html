<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PuertoGames | Contacto</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bodycontacto" style="background: url('fondo.jpg') no-repeat center/cover; background-size: cover;">
    
  <div class="body-background" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: url('fondo.jpg') no-repeat center/cover;
    z-index: -2;
    opacity: .3;
  "></div>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="logo">PuertoGames</div>
    <ul class="nav-links">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="producto.html">Producto</a></li>
      <li><a href="contacto.html">Contacto</a></li>
    </ul>
  </nav>

  <!-- FORMULARIO CONTACTO -->
  <section class="formulario-contacto">
    <h1>Contáctanos</h1>
    <form>
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" required>

      <label for="correo">Correo electrónico:</label>
      <input type="email" id="correo" required>

      <label for="mensaje">Mensaje:</label>
      <textarea id="mensaje" rows="5" required></textarea>

      <button type="submit" class="boton">Enviar</button>
    </form>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <footer class="footer">
      <p>© 2025 PuertoGames | <a href="contacto.html">Contacto</a></p>
      <p>puertogames@games.cl</p>
    </footer>

</body>
</html>
